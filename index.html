<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Planet Defense</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070d;
    overflow: hidden;
    height: 100%;
    width: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #cfe8ff;
    text-shadow: 0 0 6px rgba(0,180,255,0.6);
    font-size: 18px;
    line-height: 1.5;
    pointer-events: none;
    user-select: none;
  }
  #hud .label {
    opacity: 0.7;
    font-size: 13px;
    letter-spacing: 1px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2,4,10,0.82);
    color: #eaf6ff;
    text-align: center;
    user-select: none;
  }
  #overlay h1 {
    font-size: 42px;
    margin: 0 0 8px 0;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(60,180,255,0.8);
  }
  #overlay p {
    max-width: 480px;
    line-height: 1.6;
    color: #9db8cf;
    margin: 6px 0;
  }
  #overlay .big-score {
    font-size: 26px;
    color: #7ee0ff;
    margin: 14px 0;
  }
  #startBtn {
    margin-top: 18px;
    padding: 12px 34px;
    font-size: 18px;
    background: linear-gradient(180deg, #2ea8ff, #1073cc);
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(46,168,255,0.5);
  }
  #startBtn:hover { filter: brightness(1.15); }
  .hidden { display: none !important; }

  #pauseBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(140,220,255,0.4);
    background: rgba(10,20,35,0.6);
    color: #cfe8ff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  #pauseBtn:hover { background: rgba(20,40,60,0.8); }

  #pauseOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2,4,10,0.72);
    color: #eaf6ff;
    text-align: center;
    z-index: 4;
  }
  #pauseOverlay h2 {
    font-size: 32px;
    letter-spacing: 3px;
    margin: 0 0 18px 0;
    text-shadow: 0 0 20px rgba(60,180,255,0.8);
  }
  #resumeBtn {
    padding: 12px 34px;
    font-size: 18px;
    background: linear-gradient(180deg, #2ea8ff, #1073cc);
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(46,168,255,0.5);
  }
  #resumeBtn:hover { filter: brightness(1.15); }

  @media (max-width: 600px), (pointer: coarse) {
    #hud { font-size: 15px; top: 8px; left: 8px; }
    #hud .label { font-size: 11px; }
    #overlay { padding: 16px; }
    #overlay h1 { font-size: 30px; letter-spacing: 2px; }
    #overlay p { font-size: 14px; max-width: 340px; }
    #startBtn { padding: 14px 30px; font-size: 17px; }
    #pauseBtn { width: 38px; height: 38px; font-size: 16px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div><span class="label">SCORE</span> <span id="score">0</span></div>
  <div><span class="label">WAVE</span> <span id="wave">1</span></div>
</div>

<button id="pauseBtn" class="hidden" title="Pause (P)">⏸</button>

<div id="overlay">
  <h1>HEART DEFENSE</h1>
  <div id="finalScoreWrap" class="hidden">
    <div class="big-score">Final Score: <span id="finalScore">0</span></div>
    <p>The planet has fallen. Try again?</p>
  </div>
  <button id="startBtn">Start Defense</button>
</div>

<div id="pauseOverlay" class="hidden">
  <h2>PAUSED</h2>
  <button id="resumeBtn">Resume</button>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const waveEl = document.getElementById("wave");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const finalScoreWrap = document.getElementById("finalScoreWrap");
  const finalScoreEl = document.getElementById("finalScore");
  const pauseBtn = document.getElementById("pauseBtn");
  const pauseOverlay = document.getElementById("pauseOverlay");
  const resumeBtn = document.getElementById("resumeBtn");

  let W, H, CX, CY;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Utility ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1;
    return dx * dx + dy * dy;
  };

  // ---------- Images ----------
  const asteroidImg = new Image();
  asteroidImg.src = "heart.png"; // meteorite replacement image
  const asteroidImg2 = new Image();
asteroidImg2.src = "heart1.png";
const planetImg = new Image();
planetImg.src = "planet.png"; // swap in your own filename
  // ---------- Mouse ----------
  const mouse = { x: CX, y: CY - 200, down: false };
  canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener("mousedown", () => { mouse.down = true; });
  window.addEventListener("mouseup", () => { mouse.down = false; });
  canvas.addEventListener("touchmove", e => {
    const t = e.touches[0];
    if (t) { mouse.x = t.clientX; mouse.y = t.clientY; }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchstart", e => {
    const t = e.touches[0];
    if (t) { mouse.x = t.clientX; mouse.y = t.clientY; }
    mouse.down = true;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchend", () => { mouse.down = false; });

  // ---------- Object Pools ----------
  // Reusable arrays with "active" flags avoid GC churn from constant
  // creation/destruction of asteroids and projectiles.
  const MAX_ASTEROIDS = 120;
  const MAX_PROJECTILES = 200;
  const MAX_PARTICLES = 400;

  function makeAsteroidPool(n) {
    const pool = [];
    for (let i = 0; i < n; i++) {
      pool.push({
        active: false,
        x: 0, y: 0, vx: 0, vy: 0,
        radius: 0, hp: 1, maxHp: 1,
        rotation: 0, spin: 0,
        sides: 6, jag: [], color: "#fff"
      });
    }
    return pool;
  }
  function makeProjectilePool(n) {
    const pool = [];
    for (let i = 0; i < n; i++) {
      pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 });
    }
    return pool;
  }
  function makeParticlePool(n) {
    const pool = [];
    for (let i = 0; i < n; i++) {
      pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, color: "#fff", size: 2 });
    }
    return pool;
  }

  const MAX_POWERUPS = 6;
  const POWERUP_DEFS = {
    rapid:  { color: "#ffd23f", letter: "R", duration: 360 },
    multi:  { color: "#ff4fd8", letter: "M", duration: 360 },
    shield: { color: "#4fd8ff", letter: "S", duration: 300 }
  };
  const POWERUP_TYPES = Object.keys(POWERUP_DEFS);

  function makePowerUpPool(n) {
    const pool = [];
    for (let i = 0; i < n; i++) {
      pool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, radius: 14, type: "rapid", color: "#fff", letter: "?" });
    }
    return pool;
  }

  const asteroids = makeAsteroidPool(MAX_ASTEROIDS);
  const projectiles = makeProjectilePool(MAX_PROJECTILES);
  const particles = makeParticlePool(MAX_PARTICLES);
  const powerUps = makePowerUpPool(MAX_POWERUPS);

  function spawnAsteroid() {
    const a = asteroids.find(o => !o.active);
    if (!a) return null;
    const angle = rand(0, Math.PI * 2);
    const spawnDist = Math.max(W, H) * 0.65 + rand(0, 120);
    a.x = CX + Math.cos(angle) * spawnDist;
    a.y = CY + Math.sin(angle) * spawnDist;
    const speed = state.asteroidSpeed * rand(0.8, 1.25);
    const dx = CX - a.x, dy = CY - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    a.vx = (dx / d) * speed;
    a.vy = (dy / d) * speed;
    a.radius = rand(16, 34);
    a.maxHp = Math.max(1, Math.round(a.radius / 12));
    a.hp = a.maxHp;
    a.rotation = rand(0, Math.PI * 2);
    a.spin = rand(-0.02, 0.02);
    a.sides = 7 + Math.floor(rand(0, 4));
    a.jag = [];
    for (let i = 0; i < a.sides; i++) a.jag.push(rand(0.75, 1.15));
    a.color = `hsl(${rand(15, 35)}, ${rand(35, 55)}%, ${rand(45, 60)}%)`;
    a.img = Math.random() < 0.5 ? asteroidImg : asteroidImg2;
    a.active = true;
    return a;
  }

  function spawnProjectile(x, y, vx, vy) {
    const p = projectiles.find(o => !o.active);
    if (!p) return null;
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = 90;
    p.active = true;
    return p;
  }

  function spawnParticle(x, y, color) {
    const pt = particles.find(o => !o.active);
    if (!pt) return null;
    const angle = rand(0, Math.PI * 2);
    const speed = rand(0.5, 4);
    pt.x = x; pt.y = y;
    pt.vx = Math.cos(angle) * speed;
    pt.vy = Math.sin(angle) * speed;
    pt.maxLife = pt.life = rand(20, 45);
    pt.color = color;
    pt.size = rand(1, 3.2);
    pt.active = true;
    return pt;
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) spawnParticle(x, y, color);
  }

  function spawnPowerUp(x, y) {
    const p = powerUps.find(o => !o.active);
    if (!p) return null;
    const type = POWERUP_TYPES[Math.floor(rand(0, POWERUP_TYPES.length))];
    const def = POWERUP_DEFS[type];
    const dx = CX - x, dy = CY - y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const speed = 0.9;
    p.x = x; p.y = y;
    p.vx = (dx / d) * speed;
    p.vy = (dy / d) * speed;
    p.radius = 14;
    p.type = type;
    p.color = def.color;
    p.letter = def.letter;
    p.active = true;
    return p;
  }

  function activatePowerUp(type) {
    state.effects[type] = POWERUP_DEFS[type].duration;
  }

  // ---------- Stars (background) ----------
  const stars = [];
  function initStars() {
    stars.length = 0;
    const count = Math.floor((W * H) / 4000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.3, 1.6), tw: rand(0, Math.PI * 2)
      });
    }
  }
  initStars();
  window.addEventListener("resize", initStars);

  // ---------- Game State ----------
  const state = {
    running: false,
    paused: false,
    score: 0,
    wave: 1,
    planetRadius: 46,
    planetHp: 100,
    planetMaxHp: 100,
    asteroidSpeed: 0.55,
    spawnTimer: 0,
    spawnInterval: 90,
    waveAsteroidsLeft: 6,
    fireCooldown: 0,
    fireRate: 9,
    time: 0,
    effects: { rapid: 0, multi: 0, shield: 0 }
  };

  function resetGame() {
    for (const a of asteroids) a.active = false;
    for (const p of projectiles) p.active = false;
    for (const pt of particles) pt.active = false;
    for (const p of powerUps) p.active = false;
    state.running = true;
    state.paused = false;
    state.score = 0;
    state.wave = 1;
    state.planetHp = state.planetMaxHp;
    state.asteroidSpeed = 0.55;
    state.spawnTimer = 0;
    state.spawnInterval = 90;
    state.waveAsteroidsLeft = 6;
    state.fireCooldown = 0;
    state.time = 0;
    state.effects.rapid = 0;
    state.effects.multi = 0;
    state.effects.shield = 0;
    scoreEl.textContent = "0";
    waveEl.textContent = "1";
  }

  function startWave() {
    state.waveAsteroidsLeft = 5 + state.wave * 2;
    state.spawnInterval = Math.max(18, 90 - state.wave * 4);
    state.asteroidSpeed = 0.55 + state.wave * 0.045;
    waveEl.textContent = state.wave;
  }

  // ---------- Update ----------
  function update() {
    state.time++;

    // Power-up effect timers
    for (const key in state.effects) {
      if (state.effects[key] > 0) state.effects[key]--;
    }

    // Spawning
    if (state.waveAsteroidsLeft > 0) {
      state.spawnTimer--;
      if (state.spawnTimer <= 0) {
        spawnAsteroid();
        state.waveAsteroidsLeft--;
        state.spawnTimer = state.spawnInterval;
      }
    } else {
      // wave cleared? check no active asteroids
      let anyActive = false;
      for (const a of asteroids) if (a.active) { anyActive = true; break; }
      if (!anyActive) {
        state.wave++;
        startWave();
      }
    }

    // Firing
    if (state.fireCooldown > 0) state.fireCooldown--;
    if (mouse.down && state.fireCooldown <= 0) {
      const dx = mouse.x - CX, dy = mouse.y - CY;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const speed = 9;
      const startDist = state.planetRadius + 6;
      const baseAngle = Math.atan2(dy, dx);
      const angles = state.effects.multi > 0
        ? [baseAngle - 0.18, baseAngle, baseAngle + 0.18]
        : [baseAngle];
      for (const ang of angles) {
        spawnProjectile(
          CX + Math.cos(ang) * startDist,
          CY + Math.sin(ang) * startDist,
          Math.cos(ang) * speed,
          Math.sin(ang) * speed
        );
      }
      state.fireCooldown = state.effects.rapid > 0
        ? Math.max(2, Math.round(state.fireRate / 2.5))
        : state.fireRate;
    }

    // Projectiles
    for (const p of projectiles) {
      if (!p.active) continue;
      p.x += p.vx; p.y += p.vy;
      p.life--;
      if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
        p.active = false;
      }
    }

    // Asteroids
    for (const a of asteroids) {
      if (!a.active) continue;
      a.x += a.vx; a.y += a.vy;
      a.rotation += a.spin;

      // collision with planet
      const rr = (a.radius + state.planetRadius);
      if (dist2(a.x, a.y, CX, CY) < rr * rr) {
        if (state.effects.shield > 0) {
          burst(a.x, a.y, "#4fd8ff", 16);
        } else {
          state.planetHp -= 8 + a.radius * 0.4;
          burst(a.x, a.y, "#ff8855", 18);
          if (state.planetHp <= 0) {
            state.planetHp = 0;
            gameOver();
          }
        }
        a.active = false;
        continue;
      }

      // collision with projectiles
      for (const p of projectiles) {
        if (!p.active) continue;
        const rr2 = (a.radius + 4);
        if (dist2(a.x, a.y, p.x, p.y) < rr2 * rr2) {
          p.active = false;
          a.hp--;
          burst(p.x, p.y, "#8fe3ff", 4);
          if (a.hp <= 0) {
            state.score += Math.round(a.maxHp * 15);
            scoreEl.textContent = state.score;
            burst(a.x, a.y, a.color, 22);
            a.active = false;
            if (Math.random() < 0.15) spawnPowerUp(a.x, a.y);
          }
          break;
        }
      }
    }

    // Power-ups
    for (const p of powerUps) {
      if (!p.active) continue;
      p.x += p.vx; p.y += p.vy;
      const rr3 = (p.radius + state.planetRadius);
      if (dist2(p.x, p.y, CX, CY) < rr3 * rr3) {
        activatePowerUp(p.type);
        burst(p.x, p.y, p.color, 20);
        p.active = false;
      }
    }

    // Particles
    for (const pt of particles) {
      if (!pt.active) continue;
      pt.x += pt.vx; pt.y += pt.vy;
      pt.vx *= 0.96; pt.vy *= 0.96;
      pt.life--;
      if (pt.life <= 0) pt.active = false;
    }
  }

  // ---------- Draw ----------
  function drawBackground() {
    ctx.fillStyle = "#05070d";
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const alpha = 0.4 + 0.6 * Math.abs(Math.sin(state.time * 0.01 + s.tw));
      ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
  }

  function drawPlanet() {
    const pct = state.planetHp / state.planetMaxHp;
    const size = state.planetRadius * 2;

    // glow
    const grad = ctx.createRadialGradient(CX, CY, state.planetRadius * 0.3, CX, CY, state.planetRadius * 2.6);
    grad.addColorStop(0, "rgba(60,150,255,0.35)");
    grad.addColorStop(1, "rgba(60,150,255,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(CX, CY, state.planetRadius * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // body — image if loaded, gradient fallback otherwise
    if (planetImg.complete && planetImg.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, state.planetRadius, 0, Math.PI * 2);
      ctx.clip(); // keeps the image circular
      ctx.drawImage(planetImg, CX - size / 2, CY - size / 2, size, size);
      ctx.restore();
    } else {
      const bodyGrad = ctx.createRadialGradient(
        CX - state.planetRadius * 0.3, CY - state.planetRadius * 0.3, state.planetRadius * 0.1,
        CX, CY, state.planetRadius
      );
      bodyGrad.addColorStop(0, "#7fd6ff");
      bodyGrad.addColorStop(0.5, "#2f8fd6");
      bodyGrad.addColorStop(1, "#144a7a");
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(CX, CY, state.planetRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // shield ring
    if (state.effects.shield > 0) {
      ctx.save();
      ctx.strokeStyle = "rgba(79,216,255,0.8)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#4fd8ff";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(CX, CY, state.planetRadius + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // turret aim line
    const dx = mouse.x - CX, dy = mouse.y - CY;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    ctx.strokeStyle = "rgba(140,220,255,0.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(CX + (dx / d) * (state.planetRadius + 8), CY + (dy / d) * (state.planetRadius + 8));
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
    ctx.setLineDash([]);
}

  function drawAsteroids() {
    for (const a of asteroids) {
      if (!a.active) continue;
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rotation);
      if (a.img.complete && a.img.naturalWidth > 0) {
  const size = a.radius * 2;
  ctx.drawImage(a.img, -size / 2, -size / 2, size, size);
}else {
        ctx.beginPath();
        for (let i = 0; i < a.sides; i++) {
          const ang = (i / a.sides) * Math.PI * 2;
          const r = a.radius * a.jag[i];
          const px = Math.cos(ang) * r;
          const py = Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = a.color;
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();

      // hp pips for tougher asteroids
      if (a.maxHp > 1) {
        const barW = a.radius * 1.4;
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(a.x - barW / 2, a.y - a.radius - 10, barW, 4);
        ctx.fillStyle = "#ff5c5c";
        ctx.fillRect(a.x - barW / 2, a.y - a.radius - 10, barW * (a.hp / a.maxHp), 4);
      }
    }
  }

  function drawPowerUps() {
    for (const p of powerUps) {
      if (!p.active) continue;
      const pulse = 0.85 + 0.15 * Math.sin(state.time * 0.15 + p.x);
      ctx.save();
      ctx.translate(p.x, p.y);

      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.radius * 2.2);
      grad.addColorStop(0, p.color + "aa");
      grad.addColorStop(1, p.color + "00");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius * 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.scale(pulse, pulse);
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#05070d";
      ctx.font = "bold 14px Segoe UI, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.letter, 0, 1);
      ctx.restore();
    }
    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
  }

  function drawEffectsHUD() {
    const rows = [];
    if (state.effects.rapid > 0) rows.push({ label: "RAPID", pct: state.effects.rapid / POWERUP_DEFS.rapid.duration, color: POWERUP_DEFS.rapid.color });
    if (state.effects.multi > 0) rows.push({ label: "MULTI", pct: state.effects.multi / POWERUP_DEFS.multi.duration, color: POWERUP_DEFS.multi.color });
    if (state.effects.shield > 0) rows.push({ label: "SHIELD", pct: state.effects.shield / POWERUP_DEFS.shield.duration, color: POWERUP_DEFS.shield.color });
    if (!rows.length) return;

    let y = 64;
    const w = 100, h = 14, x = W - w - 18;
    for (const r of rows) {
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = r.color;
      ctx.fillRect(x, y, w * r.pct, h);
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#05070d";
      ctx.font = "bold 10px Segoe UI, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(r.label, x + w / 2, y + h / 2 + 1);
      y += h + 8;
    }
    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
  }

  function drawProjectiles() {
    for (const p of projectiles) {
      if (!p.active) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#bdf3ff";
      ctx.shadowColor = "#5fd4ff";
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawParticles() {
    for (const pt of particles) {
      if (!pt.active) continue;
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawCrosshair() {
    ctx.strokeStyle = "#7ee0ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 14, mouse.y);
    ctx.lineTo(mouse.x - 5, mouse.y);
    ctx.moveTo(mouse.x + 5, mouse.y);
    ctx.lineTo(mouse.x + 14, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 14);
    ctx.lineTo(mouse.x, mouse.y - 5);
    ctx.moveTo(mouse.x, mouse.y + 5);
    ctx.lineTo(mouse.x, mouse.y + 14);
    ctx.stroke();
  }

  function draw() {
    drawBackground();
    drawParticles();
    drawAsteroids();
    drawPowerUps();
    drawProjectiles();
    drawPlanet();
    drawEffectsHUD();
    drawCrosshair();
  }

  // ---------- Loop ----------
  function loop() {
    if (state.running) {
      if (!state.paused) update();
      draw();
    }
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state.running = false;
    state.paused = false;
    pauseBtn.classList.add("hidden");
    pauseOverlay.classList.add("hidden");
    finalScoreEl.textContent = state.score;
    finalScoreWrap.classList.remove("hidden");
    startBtn.textContent = "Try Again";
    overlay.style.display = "flex";
  }

  // ---------- Pause ----------
  function setPaused(p) {
    if (!state.running) return;
    state.paused = p;
    pauseOverlay.classList.toggle("hidden", !p);
    pauseBtn.textContent = p ? "▶" : "⏸";
  }

  pauseBtn.addEventListener("click", () => setPaused(!state.paused));
  resumeBtn.addEventListener("click", () => setPaused(false));
  window.addEventListener("keydown", e => {
    if (e.key === "p" || e.key === "P" || e.key === "Escape") {
      setPaused(!state.paused);
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setPaused(true);
  });

  startBtn.addEventListener("click", () => {
    overlay.style.display = "none";
    finalScoreWrap.classList.add("hidden");
    resetGame();
    startWave();
    pauseBtn.classList.remove("hidden");
    pauseBtn.textContent = "⏸";
  });

  // initial idle background render behind overlay
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
